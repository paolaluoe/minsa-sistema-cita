<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINSA - Dashboard Analítico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --minsa-primary: #0A3C67; --bg-light: #F4F7F6; }
        body { background-color: var(--bg-light); font-family: system-ui, -apple-system, sans-serif; }
        .minsa-header { background-color: var(--minsa-primary); color: white; padding: 15px 30px; }
    </style>
</head>
<body>
    <header class="minsa-header d-flex justify-content-between align-items-center shadow">
        <h1 class="h5 mb-0 fw-bold text-white">MINSA - Panel Analítico & KPIs</h1>
        <a href="admin.html" class="btn btn-sm btn-outline-light">Salir del Dashboard</a>
    </header>

    <main class="container py-4">
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card border-0 shadow-sm p-3 bg-white border-start border-primary border-4">
                    <span class="text-muted small fw-bold">TOTAL CITAS RESERVADAS</span>
                    <h2 class="display-6 fw-bold text-primary mb-0">1,248</h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card border-0 shadow-sm p-3 bg-white border-start border-success border-4">
                    <span class="text-muted small fw-bold">HOSPITALES ACTIVOS</span>
                    <h2 class="display-6 fw-bold text-success mb-0">12</h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card border-0 shadow-sm p-3 bg-white border-start border-warning border-4">
                    <span class="text-muted small fw-bold">ESPECIALIDAD MÁS SOLICITADA</span>
                    <h2 class="h3 fw-bold text-warning mb-0">Cardiología</h2>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
